[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rowstead"
version = "0.1.0"
description = "Resumable CSV/XLSX enrichment with HTTP and browser workers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["batch-processing", "fastapi", "playwright", "csv", "xlsx"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "openpyxl>=3.1,<4", "Jinja2>=3.1,<4", "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3", "playwright>=1.50,<2", "defusedxml>=0.7,<1", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*", "demo*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=artifacts/pytest"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
